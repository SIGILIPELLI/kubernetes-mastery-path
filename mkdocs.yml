      - "03 · Network Policies": level-3/03-network-policies.md
      - "04 · Autoscaling (HPA & VPA Concepts)": level-3/04-autoscaling-hpa-vpa.md
      - "05 · Observability: Metrics & Logging": level-3/05-observability-metrics-logging.md
      - "06 · Probes & Health at Scale": level-3/06-probes-at-scale.md
      - "07 · Multi-Cluster & Multi-Tenancy Concepts": level-3/07-multi-cluster-multi-tenancy.md
